<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TinyDotFood — Smart Batch & Food Traceability</title>
  <meta name="description" content="TinyDotFood — Farm-to-fork batch traceability, ingredient management, and recall engine.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-layout">
    <!-- TinyDotFood Sidebar -->
    <aside class="sidebar">
      <!-- Custom TinyDotFood Brand Logo -->
      <div class="brand">
        <div class="brand-logo">
          <!-- Custom SVG TinyDot Logo -->
          <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="40" height="40" rx="12" fill="url(#brandGrad)"/>
            <circle cx="20" cy="20" r="11" stroke="#ffffff" stroke-width="2" stroke-dasharray="3 3"/>
            <circle cx="20" cy="20" r="5" fill="#ffffff"/>
            <circle cx="26" cy="14" r="2.5" fill="#10b981"/>
            <defs>
              <linearGradient id="brandGrad" x1="0" y1="0" x2="40" y2="40">
                <stop stop-color="#ff5d38"/>
                <stop offset="1" stop-color="#f59e0b"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <div class="brand-text">
          <div class="brand-name">TinyDot<span class="brand-accent">Food</span><span class="live-dot"></span></div>
          <span class="brand-sub">Smart Food ERP</span>
        </div>
      </div>
      <!-- Navigation Menu -->
      <nav id="nav">
        <button data-v="dashboard" class="on">
          <span class="nav-dot"></span>
          <span>Dashboard</span>
        </button>
        <button data-v="lots">
          <span class="nav-dot"></span>
          <span>Ingredient Lots</span>
        </button>
        <button data-v="batches">
          <span class="nav-dot"></span>
          <span>Production Batches</span>
        </button>
        <button data-v="shipments">
          <span class="nav-dot"></span>
          <span>Shipments</span>
        </button>
        <button data-v="trace">
          <span class="nav-dot"></span>
          <span>Trace &amp; Recall</span>
        </button>
      </nav>
      <!-- TinyDot Quick Status Widget -->
      <div class="sidebar-status-card">
        <div class="status-header">
          <span class="status-pulse"></span>
          <span>System Healthy</span>
        </div>
        <div class="status-sub">FSMA 204 • Sub-2s Trace</div>
      </div>
    </aside>
    <!-- Main Viewport -->
    <main class="main">
      <div id="msg" role="status" aria-live="polite"></div>
      <div id="view"></div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
